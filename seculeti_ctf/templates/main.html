<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECULETI — Главная</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
    position: relative;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    overflow: hidden;
}

/* Анимированная сетка */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 25s linear infinite;
    pointer-events: none;
}

@keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: -40px -40px; }
}

/* Мягкий блик - monochrome */
body::after {
    content: "";
    position: fixed;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    filter: blur(100px);
    animation: pulse 7s ease-in-out infinite alternate;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

@keyframes pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.18); }
}

.container {
    position: relative;
    width: 90%;
    max-width: 720px;
    padding: 50px 40px;
    background: rgba(20,20,20,0.78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(255,255,255,0.04);
    z-index: 2;
    text-align: center;
}

/* ЧБ ГЛИТЧ - приглушённый */
.glitch {
    font-family: 'Courier New', Courier, monospace;
    font-size: 3.4rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    position: relative;
    display: inline-block;
    color: rgba(255,255,255,0.85);
    text-shadow: 2px 0 0 rgba(255,255,255,0.3), -2px 0 0 rgba(0,0,0,0.5);
    animation: glitch-skew 0.8s infinite linear alternate;
    line-height: 1.05;
    margin: 0.4em 0 0.8em;
    user-select: none;
}

.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.glitch::before {
    left: 2px;
    text-shadow: -2px 0 rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.6);
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim 1.2s infinite linear alternate-reverse;
    opacity: 0.5;
}

.glitch::after {
    left: -2px;
    text-shadow: 2px 0 rgba(0,0,0,0.6);
    color: rgba(200,200,200,0.6);
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim2 1.5s infinite linear alternate-reverse;
    opacity: 0.5;
}

@keyframes glitch-anim {
    0%   { clip: rect(25px, 9999px, 80px, 0); transform: skew(0.4deg) translateX(1px); }
    5%   { clip: rect(45px, 9999px, 95px, 0); transform: skew(-0.5deg) translateX(-1px); }
    10%  { clip: rect(15px, 9999px, 65px, 0); transform: skew(0.3deg) translateX(1px); }
    15%  { clip: rect(60px, 9999px, 110px, 0); transform: translateX(-1px); }
    20%  { clip: rect(10px, 9999px, 50px, 0); transform: skew(-0.3deg) translateX(2px); }
    100% { clip: rect(30px, 9999px, 85px, 0); transform: skew(-0.2deg) translateX(-1px); }
}

@keyframes glitch-anim2 {
    0%   { clip: rect(40px, 9999px, 95px, 0); transform: skew(-0.3deg) translateX(-1px); }
    5%   { clip: rect(20px, 9999px, 70px, 0); transform: skew(0.4deg) translateX(1px); }
    10%  { clip: rect(55px, 9999px, 105px, 0); transform: translateX(-2px); }
    15%  { clip: rect(5px, 9999px, 40px, 0); transform: skew(0.2deg) translateX(1px); }
    100% { clip: rect(35px, 9999px, 90px, 0); transform: skew(0.1deg) translateX(1px); }
}

@keyframes glitch-skew {
    0%, 100% { transform: skew(0deg); }
    20%, 60% { transform: skew(0.8deg); }
    40%, 80% { transform: skew(-0.8deg); }
}

.links {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 40px;
}

.links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s ease;
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
    padding: 5px 0;
}

/* VHS-стиль hover эффект для ссылок */
.links a::before {
    content: attr(data-text);
    position: absolute;
    top: 5px;
    left: 0;
    width: 100%;
    height: 100%;
    color: rgba(255,255,255,0.3);
    opacity: 0;
    transform: translate(0);
    transition: all 0.1s ease;
}

.links a:hover {
    color: white;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        2px 0 0 rgba(255,255,255,0.2),
        -2px 0 0 rgba(255,255,255,0.2);
    animation: linkGlitch 0.5s ease-in-out;
}

.links a:hover::before {
    opacity: 1;
    animation: linkGhostGlitch 0.6s infinite ease-in-out;
}

@keyframes linkGlitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px, 0.5px); }
    40% { transform: translate(1px, -0.5px); }
    60% { transform: translate(-0.5px, -0.5px); }
    80% { transform: translate(0.5px, 0.5px); }
    100% { transform: translate(0); }
}

@keyframes linkGhostGlitch {
    0%, 100% { transform: translate(0); opacity: 0.3; }
    25% { transform: translate(-1px, 0.5px); opacity: 0.5; }
    50% { transform: translate(1px, -0.5px); opacity: 0.2; }
    75% { transform: translate(-0.5px, 1px); opacity: 0.4; }
}
</style>
</head>
