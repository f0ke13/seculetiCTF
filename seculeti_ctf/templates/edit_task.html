<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECULETI — Редактирование задачи</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
    position: relative;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow: auto;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 25s linear infinite;
    pointer-events: none;
}

@keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: -40px -40px; }
}

body::after {
    content: "";
    position: fixed;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    filter: blur(100px);
    animation: pulse 7s ease-in-out infinite alternate;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

@keyframes pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.18); }
}

nav {
    position: relative;
    z-index: 1000;
    background: transparent;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 15px 0;
    overflow: hidden;
}

nav::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            rgba(255,255,255,0.03) 1px,
            rgba(255,255,255,0.03) 2px
        );
    pointer-events: none;
    animation: scanMove 4s linear infinite;
}

@keyframes scanMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 4px; }
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 40px;
    position: relative;
    z-index: 1;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: white;
    text-decoration: none;
    text-transform: uppercase;
}

.nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
    margin-left: auto;
}

.nav-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s ease;
}

.nav-links a:hover { color: white; }

.container {
    position: relative;
    width: 90%;
    max-width: 980px;
    padding: 50px 40px;
    background: rgba(20,20,20,0.78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(255,255,255,0.04);
    z-index: 2;
}

h1, h2 {
    font-family: 'Courier New', Courier, monospace;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    opacity: 0.8;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 10px 12px;
    background: #111;
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 7px;
    font-family: inherit;
}

.btn {
    padding: 10px 22px;
    background: white;
    color: black;
    border: none;
    font-weight: 600;
    cursor: pointer;
    border-radius: 7px;
    letter-spacing: 1px;
    text-decoration: none;
}

.btn-cancel { background: #555; color: #fff; }
</style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="{{ url_for('admin_dashboard') }}" class="logo">SECULETI ADMIN</a>
        <div class="nav-links">
            <a href="{{ url_for('admin_tasks') }}">НАЗАД</a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        <h2>Изменить задачу #{{ task.id }}</h2>
        <form method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" name="title" value="{{ task.title }}" required>
                </div>
                <div class="form-group">
                    <label>Очки</label>
                    <input type="number" name="points" value="{{ task.points }}" required>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select name="category_id" required>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == task.category_id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-grid" style="margin-top: 12px;">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Описание</label>
                    <textarea name="description" required rows="4">{{ task.description }}</textarea>
                </div>
                <div class="form-group">
                    <label>Новый флаг (оставьте пустым чтобы не менять)</label>
                    <input type="text" name="flag">
                </div>
            </div>
            <div style="margin-top: 12px;">
                <button type="submit" class="btn">Сохранить</button>
                <a href="{{ url_for('admin_tasks') }}" class="btn btn-cancel">Отмена</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
