<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETUCTF Register</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Animated grid */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 25s linear infinite;
    pointer-events: none;
}

@keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: -40px -40px; }
}

/* Soft glow - monochrome */
body::after {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    filter: blur(90px);
    animation: pulse 6s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to { transform: translate(-50%, -50%) scale(1.15); }
}

.container {
    position: relative;
    width: 380px;
    padding: 45px;
    background: rgba(20,20,20,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    box-shadow: 0 0 50px rgba(255,255,255,0.05);
    z-index: 2;
}

.title {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 30px;
}

.title span {
    opacity: 0.7;
}

.input-group {
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: white;
    font-size: 14px;
    transition: 0.3s;
}

input::placeholder {
    color: rgba(255,255,255,0.5);
}

input:focus {
    outline: none;
    border-color: white;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 5px;
    background: white;
    color: black;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    letter-spacing: 1px;
}

button:hover {
    background: #e6e6e6;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,255,255,0.2);
}

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.6;
}

.footer a {
    color: white;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    transition: 0.3s;
}

.footer a:hover {
    opacity: 1;
    border-bottom: 1px solid white;
}

/* Navigation Menu - DeadSec VHS стиль */
nav {
    position: relative;
    z-index: 1000;
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 15px 0;
    overflow: hidden;
}

/* VHS scanlines */
nav::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            rgba(255,255,255,0.03) 1px,
            rgba(255,255,255,0.03) 2px
        );
    pointer-events: none;
    animation: scanMove 4s linear infinite;
}

/* VHS glitch overlay */
nav::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        linear-gradient(90deg, 
            transparent 0%, 
            rgba(255,255,255,0.02) 50%, 
            transparent 100%
        );
    background-size: 200% 100%;
    animation: vhsFlicker 0.15s infinite, vhsShift 8s ease-in-out infinite;
    pointer-events: none;
}

@keyframes scanMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 4px; }
}

@keyframes vhsFlicker {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
}

@keyframes vhsShift {
    0%, 100% { background-position: 200% 0; }
    50% { background-position: -200% 0; }
}

/* DeadSec glitch effect on logo */
nav .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: white;
    text-decoration: none;
    position: relative;
    display: inline-block;
    text-transform: uppercase;
}

nav .logo::before,
nav .logo::after {
    content: 'SECULETI';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
}

nav .logo::before {
    color: rgba(255,255,255,0.5);
    animation: deadsecGlitch1 3s infinite;
}

nav .logo::after {
    color: rgba(255,255,255,0.3);
    animation: deadsecGlitch2 2.5s infinite;
}

@keyframes deadsecGlitch1 {
    0%, 90%, 100% { opacity: 0; transform: translate(0); }
    91% { opacity: 0.8; transform: translate(-2px, 1px); }
    92% { opacity: 0.5; transform: translate(2px, -1px); }
    93% { opacity: 0; transform: translate(0); }
}

@keyframes deadsecGlitch2 {
    0%, 85%, 100% { opacity: 0; transform: translate(0); }
    86% { opacity: 0.6; transform: translate(1px, 2px); }
    87% { opacity: 0.3; transform: translate(-1px, -1px); }
    88% { opacity: 0; transform: translate(0); }
}

nav .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
}

nav .nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
}

nav .nav-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s ease;
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
}

nav .nav-links a::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: white;
    transition: width 0.3s ease;
    box-shadow: 0 0 4px rgba(255,255,255,0.5);
}

nav .nav-links a:hover {
    color: white;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
}

nav .nav-links a:hover::after {
    width: 100%;
}
</style>
</head>

<body>

<nav>
    <div class="nav-container">
        <a href="{{ url_for('login') }}" class="logo">SECULETI</a>
        <div class="nav-links">
            <a href="{{ url_for('about') }}">О НАС</a>
            <a href="{{ url_for('login') }}">ВХОД</a>
            <a href="{{ url_for('register') }}">РЕГИСТРАЦИЯ</a>
        </div>
    </div>
</nav>

<div class="main-content">
<div class="container">
    <div class="title">SECULETI</div>

    <form id="registerForm" action="{{ url_for('register') }}" method="POST">
        <div class="input-group">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        </div>

        <button type="submit">REGISTER</button>
    </form>

    <div class="footer">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    const inputs = document.querySelectorAll("input");
    const password = inputs[1].value;
    const confirm = inputs[2].value;

    if (password !== confirm) {
        e.preventDefault();
        alert("Passwords do not match");
        return;
    }
});
</script>

</body>
</html>
