<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECULETI — Categories</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

/* Анимированная сетка */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 25s linear infinite;
}

@keyframes moveGrid {
    from { transform: translate(0,0); }
    to { transform: translate(-40px,-40px); }
}

/* Мягкий блик */
body::after {
    content: "";
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    filter: blur(100px);
    animation: pulse 7s ease-in-out infinite alternate;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

@keyframes pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.18); }
}

.container {
    position: relative;
    width: 90%;
    max-width: 820px;
    padding: 60px 40px 80px;
    background: rgba(20,20,20,0.78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(255,255,255,0.04);
    z-index: 2;
    text-align: center;
}

/* Чёрно-белый глитч SECULETI */
.glitch {
    font-family: 'Courier New', Courier, monospace;
    font-size: 3.4rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    position: relative;
    display: inline-block;
    color: #ffffff;
    text-shadow:
        3px 0 0 #ffffff,
        -3px 0 0 #000000;
    animation: glitch-skew 0.8s infinite linear alternate;
    line-height: 1.05;
    margin-bottom: 3.5rem;
    user-select: none;
}

.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.85;
}

.glitch::before {
    left: 3px;
    text-shadow: 3px 0 #ffffff;
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim 1.2s infinite linear alternate-reverse;
}

.glitch::after {
    left: -3px;
    text-shadow: -3px 0 #000000;
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim2 1.5s infinite linear alternate-reverse;
}

@keyframes glitch-anim {
    0%   { clip: rect(25px, 9999px, 80px, 0); transform: skew(0.6deg); }
    5%   { clip: rect(45px, 9999px, 95px, 0); transform: skew(-0.8deg); }
    10%  { clip: rect(15px, 9999px, 65px, 0); transform: skew(0.4deg); }
    15%  { clip: rect(60px, 9999px, 110px, 0); }
    100% { clip: rect(30px, 9999px, 85px, 0); transform: skew(-0.3deg); }
}

@keyframes glitch-anim2 {
    0%   { clip: rect(40px, 9999px, 95px, 0); transform: skew(-0.5deg); }
    5%   { clip: rect(20px, 9999px, 70px, 0); transform: skew(0.7deg); }
    10%  { clip: rect(55px, 9999px, 105px, 0); }
    100% { clip: rect(35px, 9999px, 90px, 0); transform: skew(0.2deg); }
}

@keyframes glitch-skew {
    0%, 100% { transform: skew(0deg); }
    20%, 60% { transform: skew(1.5deg); }
    40%, 80% { transform: skew(-1.5deg); }
}

/* КАТЕГОРИИ — DeadSec стиль */
.categories-section {
    margin-top: 1rem;
}

.section-title {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.95rem;
    letter-spacing: 8px;
    margin-bottom: 2.8rem;
    opacity: 0.85;
    text-transform: uppercase;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 22px;
}

.category-card {
    background: rgba(15,15,15,0.95);
    border: 1px solid #ffffff;
    border-radius: 8px;
    padding: 32px 20px 24px;
    transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: white;
}

.category-card:hover {
    transform: scale(1.06) translateY(-6px);
    box-shadow: 0 0 30px rgba(255,255,255,0.35);
    border-color: #ffffff;
}

.category-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: 0.6s;
}

.category-card:hover::before {
    left: 200%;
}

.card-icon {
    width: 68px;
    height: 68px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    fill: #ffffff;
    transition: transform 0.4s ease;
}

.category-card:hover .card-icon {
    transform: scale(1.15);
}

.category-card h3 {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0;
    transition: all 0.3s ease;
}

.category-card:hover h3 {
    text-shadow: 0 0 12px #ffffff;
}

/* TELEGRAM */
.footer {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 1.65rem;
    font-weight: 600;
    letter-spacing: 0.4px;
    opacity: 0.95;
}

.telegram-logo {
    width: 40px;
    height: 40px;
    fill: #fff;
    transition: transform 0.3s ease;
}

.footer a {
    color: #fff;
    text-decoration: none;
    border-bottom: 2px solid rgba(255,255,255,0.5);
    transition: all 0.3s ease;
    padding-bottom: 2px;
}

.footer a:hover {
    border-bottom-color: #fff;
    opacity: 1;
    transform: translateY(-2px);
}

.footer:hover .telegram-logo {
    transform: scale(1.12);
}

/* Navigation Menu */
nav {
    position: relative;
    z-index: 1000;
    background: rgba(20,20,20,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 15px 0;
}

nav .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: white;
    text-decoration: none;
}

nav .nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
}

nav .nav-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: 0.3s;
    letter-spacing: 1px;
}

nav .nav-links a:hover {
    color: white;
}

nav .logout-btn {
    background: rgba(255,255,255,0.1);
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
}

nav .logout-btn:hover {
    background: rgba(255,255,255,0.15);
}
</style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="{{ url_for('category') }}" class="logo">SECULETI</a>
        <div class="nav-links">
            <a href="{{ url_for('about') }}">О НАС</a>
            <a href="{{ url_for('category') }}">КАТЕГОРИИ</a>
            {% if session.get('user_id') %}
                <a href="#" class="logout-btn" onclick="if(confirm('Выйти?')) window.location.href='{{ url_for('logout') }}'; return false;">ВЫХОД</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="main-content">
<div class="container">

    <div class="glitch" data-text="SECULETI">SECULETI</div>

    <!-- Только категории -->
    <div class="categories-section">
        <h2 class="section-title" data-text="CATEGORIES">CATEGORIES</h2>

        <div class="category-grid">

            <!-- OSINT -->
            <a href="{{ url_for('osint') }}" class="category-card" title="OSINT">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.59 2 12.5C2 18.41 6.48 23 12 23C17.52 23 22 18.41 22 12.5C22 6.59 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12.5C4 8.59 7.59 5 12 5C16.41 5 20 8.59 20 12.5C20 16.41 16.41 20 12 20Z"/>
                        <circle cx="12" cy="12.5" r="3.5"/>
                    </svg>
                </div>
                <h3>OSINT</h3>
            </a>

            <!-- WEB -->
            <a href="#" class="category-card" target="_blank" title="WEB">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v2h-2V7zm0 4h2v6h-2v-6z"/>
                    </svg>
                </div>

            <!-- Beginner -->
            <a href="#" class="category-card" target="_blank" title="Beginner">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>

                <h3>BEGINNER</h3>

            <a href="#" class="category-card" target="_blank" title="Crypto">
                <div class="card-icon">

                    </svg>
                </div>

            </a>

        </div>
    </div>

</div>

<div class="footer">
    <a href="https://t.me/seculeti" target="_blank">
        <svg class="telegram-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 0C53.7 0 0 53.7 0 120s53.7 120 120 120 120-53.7 120-120S186.3 0 120 0zm58.3 81.6l-22.2 104.6c-1.6 7.3-6 9.2-12.2 5.7l-33.8-24.9-16.3 15.7c-1.8 1.8-3.3 3.3-6.8 3.3l2.4-34.4 62.7-56.7c2.7-2.4-0.6-3.8-3.7-1.4l-77.5 48.8-33.4-10.4c-7.3-2.3-7.5-7.3 1.6-10.8l130.8-50.4c6-2.7 11.3 1.4 9.4 8.9z"/>
        </svg>

</div>
</div>

</body>
</html>
