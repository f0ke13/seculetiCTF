<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECULETI — О нас.</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
    position: relative;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    overflow: hidden;
}

/* Анимированная сетка */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 25s linear infinite;
    pointer-events: none;
}

@keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: -40px -40px; }
}

/* Мягкий блик - monochrome */
body::after {
    content: "";
    position: fixed;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    filter: blur(100px);
    animation: pulse 7s ease-in-out infinite alternate;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

@keyframes pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.18); }
}

.container {
    position: relative;
    width: 90%;
    max-width: 720px;
    padding: 50px 40px;
    background: rgba(20,20,20,0.78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(255,255,255,0.04);
    z-index: 2;
    text-align: center;
}

/* ЧБ ГЛИТЧ - приглушённый */
.glitch {
    font-family: 'Courier New', Courier, monospace;
    font-size: 3.4rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    position: relative;
    display: inline-block;
    color: rgba(255,255,255,0.85);
    text-shadow: 2px 0 0 rgba(255,255,255,0.3), -2px 0 0 rgba(0,0,0,0.5);
    animation: glitch-skew 0.8s infinite linear alternate;
    line-height: 1.05;
    margin: 0.4em 0 0.8em;
    user-select: none;
}

.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.glitch::before {
    left: 2px;
    text-shadow: -2px 0 rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.6);
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim 1.2s infinite linear alternate-reverse;
    opacity: 0.5;
}

.glitch::after {
    left: -2px;
    text-shadow: 2px 0 rgba(0,0,0,0.6);
    color: rgba(200,200,200,0.6);
    clip: rect(0, 900px, 0, 0);
    animation: glitch-anim2 1.5s infinite linear alternate-reverse;
    opacity: 0.5;
}

@keyframes glitch-anim {
    0%   { clip: rect(25px, 9999px, 80px, 0); transform: skew(0.4deg) translateX(1px); }
    5%   { clip: rect(45px, 9999px, 95px, 0); transform: skew(-0.5deg) translateX(-1px); }
    10%  { clip: rect(15px, 9999px, 65px, 0); transform: skew(0.3deg) translateX(1px); }
    15%  { clip: rect(60px, 9999px, 110px, 0); transform: translateX(-1px); }
    20%  { clip: rect(10px, 9999px, 50px, 0); transform: skew(-0.3deg) translateX(2px); }
    100% { clip: rect(30px, 9999px, 85px, 0); transform: skew(-0.2deg) translateX(-1px); }
}

@keyframes glitch-anim2 {
    0%   { clip: rect(40px, 9999px, 95px, 0); transform: skew(-0.3deg) translateX(-1px); }
    5%   { clip: rect(20px, 9999px, 70px, 0); transform: skew(0.4deg) translateX(1px); }
    10%  { clip: rect(55px, 9999px, 105px, 0); transform: translateX(-2px); }
    15%  { clip: rect(5px, 9999px, 40px, 0); transform: skew(0.2deg) translateX(1px); }
    100% { clip: rect(35px, 9999px, 90px, 0); transform: skew(0.1deg) translateX(1px); }
}

@keyframes glitch-skew {
    0%, 100% { transform: skew(0deg); }
    20%, 60% { transform: skew(0.8deg); }
    40%, 80% { transform: skew(-0.8deg); }
}

/* Текст "О нас" */
.about-text {
    font-size: 1.15rem;
    line-height: 1.75;
    opacity: 0.92;
    margin: 2.2rem 0 4rem;
    white-space: pre-wrap;
}

/* TELEGRAM */
.footer {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 1.65rem;
    font-weight: 600;
    letter-spacing: 0.4px;
    opacity: 0.95;
}

.telegram-logo {
    width: 40px;
    height: 40px;
    fill: #fff;
    transition: transform 0.3s ease;
}

.footer a {
    color: #fff;
    text-decoration: none;
    border-bottom: 2px solid rgba(255,255,255,0.5);
    transition: all 0.3s ease;
    padding-bottom: 2px;
}

.footer a:hover {
    border-bottom-color: #fff;
    opacity: 1;
    transform: translateY(-2px);
}

.footer:hover .telegram-logo {
    transform: scale(1.12);
}

/* Navigation Menu - DeadSec VHS стиль */
nav {
    position: relative;
    z-index: 1000;
    background: transparent;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 15px 0;
    overflow: hidden;
}

/* VHS scanlines на всю шапку */
nav::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            rgba(255,255,255,0.03) 1px,
            rgba(255,255,255,0.03) 2px
        );
    pointer-events: none;
    animation: scanMove 4s linear infinite;
}

/* VHS glitch overlay на всю шапку */
nav::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        linear-gradient(90deg, 
            transparent 0%, 
            rgba(255,255,255,0.03) 15%,
            transparent 30%,
            rgba(255,255,255,0.02) 50%,
            transparent 70%,
            rgba(255,255,255,0.03) 85%,
            transparent 100%
        );
    background-size: 300% 100%;
    animation: vhsFlicker 0.5s infinite, vhsShift 6s ease-in-out infinite;
    pointer-events: none;
}

@keyframes scanMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 4px; }
}

@keyframes vhsFlicker {
    0%, 100% { opacity: 0.7; }
    25% { opacity: 1; }
    50% { opacity: 0.8; }
    75% { opacity: 0.95; }
}

@keyframes vhsShift {
    0%, 100% { background-position: 300% 0; }
    50% { background-position: -300% 0; }
}

@keyframes navGlitch {
    0%, 95%, 100% { transform: translate(0); }
    96% { transform: translate(-2px, 0); }
    97% { transform: translate(2px, 0); }
    98% { transform: translate(-1px, 0); }
    99% { transform: translate(1px, 0); }
}

@keyframes navDistort {
    0%, 90%, 100% { clip-path: inset(0); }
    91% { clip-path: inset(10% 0 80% 0); }
    92% { clip-path: inset(40% 0 40% 0); }
    93% { clip-path: inset(80% 0 10% 0); }
    94% { clip-path: inset(0); }
}

/* DeadSec glitch effect on logo */
nav .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: white;
    text-decoration: none;
    position: relative;
    display: inline-block;
    text-transform: uppercase;
    animation: logoGlitch 8s infinite;
}

nav .logo::before,
nav .logo::after {
    content: 'SECULETI';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
}

nav .logo::before {
    color: rgba(255,255,255,0.8);
    animation: deadsecGlitch1 6s infinite;
}

nav .logo::after {
    color: rgba(255,255,255,0.5);
    animation: deadsecGlitch2 5s infinite;
}

@keyframes logoGlitch {
    0%, 95%, 100% { filter: none; }
    96% { filter: blur(0.2px); }
    97% { filter: none; }
    98% { filter: blur(0.1px); }
    99% { filter: none; }
}

@keyframes deadsecGlitch1 {
    0%, 95%, 100% { opacity: 0; transform: translate(0); }
    96% { opacity: 0.4; transform: translate(-1px, 0.5px); }
    97% { opacity: 0.3; transform: translate(1px, -0.5px); }
    98% { opacity: 0.2; transform: translate(-0.5px, 0.5px); }
    99% { opacity: 0.1; transform: translate(0.5px, -0.5px); }
}

@keyframes deadsecGlitch2 {
    0%, 95%, 100% { opacity: 0; transform: translate(0); }
    96% { opacity: 0.3; transform: translate(1px, 1px); }
    97% { opacity: 0.2; transform: translate(-1px, -0.5px); }
    98% { opacity: 0.1; transform: translate(0.5px, -1px); }
    99% { opacity: 0.05; transform: translate(-0.5px, 1px); }
}

nav .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
}

nav .nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
}

nav .nav-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
    padding: 5px 0;
}

/* VHS-стиль hover эффект для ссылок */
nav .nav-links a::before {
    content: attr(data-text);
    position: absolute;
    top: 5px;
    left: 0;
    width: 100%;
    height: 100%;
    color: rgba(255,255,255,0.3);
    opacity: 0;
    transform: translate(0);
    transition: all 0.1s ease;
}

nav .nav-links a::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: white;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
    box-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 2px white;
}

nav .nav-links a:hover {
    color: white;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        2px 0 0 rgba(255,255,255,0.2),
        -2px 0 0 rgba(255,255,255,0.2);
    animation: linkGlitch 0.5s ease-in-out;
}

nav .nav-links a:hover::before {
    opacity: 1;
    animation: linkGhostGlitch 0.6s infinite ease-in-out;
}

@keyframes linkGlitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px, 0.5px); }
    40% { transform: translate(1px, -0.5px); }
    60% { transform: translate(-0.5px, -0.5px); }
    80% { transform: translate(0.5px, 0.5px); }
    100% { transform: translate(0); }
}

@keyframes linkGhostGlitch {
    0%, 100% { transform: translate(0); opacity: 0.3; }
    25% { transform: translate(-1px, 0.5px); opacity: 0.5; }
    50% { transform: translate(1px, -0.5px); opacity: 0.2; }
    75% { transform: translate(-0.5px, 1px); opacity: 0.4; }
}

nav .logout-btn {
    background: rgba(255,255,255,0.08);
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
}

nav .logout-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
}
</style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="{% if session.get('user_id') %}{{ url_for('category') }}{% else %}{{ url_for('login') }}{% endif %}" class="logo">SECULETI</a>
        <div class="nav-links">
            <a href="{{ url_for('about') }}" data-text="О НАС">О НАС</a>
            {% if session.get('user_id') %}
                <a href="{{ url_for('category') }}" data-text="КАТЕГОРИИ">КАТЕГОРИИ</a>
                <a href="#" class="logout-btn" data-text="ВЫХОД" onclick="if(confirm('Выйти?')) window.location.href='{{ url_for('logout') }}'; return false;">ВЫХОД</a>
            {% else %}
                <a href="{{ url_for('login') }}" data-text="ВХОД">ВХОД</a>
                <a href="{{ url_for('register') }}" data-text="РЕГИСТРАЦИЯ">РЕГИСТРАЦИЯ</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="main-content">
<div class="container">

    <div class="glitch" data-text="SECULETI">SECULETI</div>

    <div class="about-text">
        Мы — seculeti.
    </div>

</div>

<div class="footer">
    <a href="https://t.me/seculeti" target="_blank">
        <svg class="telegram-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 0C53.7 0 0 53.7 0 120s53.7 120 120 120 120-53.7 120-120S186.3 0 120 0zm58.3 81.6l-22.2 104.6c-1.6 7.3-6 9.2-12.2 5.7l-33.8-24.9-16.3 15.7c-1.8 1.8-3.3 3.3-6.8 3.3l2.4-34.4 62.7-56.7c2.7-2.4-0.6-3.8-3.7-1.4l-77.5 48.8-33.4-10.4c-7.3-2.3-7.5-7.3 1.6-10.8l130.8-50.4c6-2.7 11.3 1.4 9.4 8.9z"/>
        </svg>
        t.me/seculeti
    </a>
</div>
</div>

</body>
</html>
