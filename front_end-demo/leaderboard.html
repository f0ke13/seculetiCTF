<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECULETI — Leaderboard</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
    position: relative;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow: auto;
}

/* Анимированная сетка */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 25s linear infinite;
    pointer-events: none;
}

@keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: -40px -40px; }
}

/* Мягкий блик - monochrome */
body::after {
    content: "";
    position: fixed;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    filter: blur(100px);
    animation: pulse 7s ease-in-out infinite alternate;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

@keyframes pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.18); }
}

/* ===== Navigation — DeadSec VHS стиль ===== */
nav {
    position: relative;
    z-index: 1000;
    background: transparent;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 15px 0;
    overflow: hidden;
}

nav::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            rgba(255,255,255,0.03) 1px,
            rgba(255,255,255,0.03) 2px
        );
    pointer-events: none;
    animation: scanMove 4s linear infinite;
}

nav::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
        linear-gradient(90deg,
            transparent 0%,
            rgba(255,255,255,0.03) 15%,
            transparent 30%,
            rgba(255,255,255,0.02) 50%,
            transparent 70%,
            rgba(255,255,255,0.03) 85%,
            transparent 100%
        );
    background-size: 300% 100%;
    animation: vhsFlicker 0.5s infinite, vhsShift 6s ease-in-out infinite;
    pointer-events: none;
}

@keyframes scanMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 4px; }
}

@keyframes vhsFlicker {
    0%, 100% { opacity: 0.7; }
    25% { opacity: 1; }
    50% { opacity: 0.8; }
    75% { opacity: 0.95; }
}

@keyframes vhsShift {
    0%, 100% { background-position: 300% 0; }
    50% { background-position: -300% 0; }
}

nav .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: white;
    text-decoration: none;
    position: relative;
    display: inline-block;
    text-transform: uppercase;
    animation: logoGlitch 8s infinite;
}

nav .logo::before,
nav .logo::after {
    content: 'SECULETI';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
}

nav .logo::before {
    color: rgba(255,255,255,0.8);
    animation: deadsecGlitch1 6s infinite;
}

nav .logo::after {
    color: rgba(255,255,255,0.5);
    animation: deadsecGlitch2 5s infinite;
}

@keyframes logoGlitch {
    0%, 95%, 100% { filter: none; }
    96% { filter: blur(0.2px); }
    97% { filter: none; }
    98% { filter: blur(0.1px); }
    99% { filter: none; }
}

@keyframes deadsecGlitch1 {
    0%, 95%, 100% { opacity: 0; transform: translate(0); }
    96% { opacity: 0.4; transform: translate(-1px, 0.5px); }
    97% { opacity: 0.3; transform: translate(1px, -0.5px); }
    98% { opacity: 0.2; transform: translate(-0.5px, 0.5px); }
    99% { opacity: 0.1; transform: translate(0.5px, -0.5px); }
}

@keyframes deadsecGlitch2 {
    0%, 95%, 100% { opacity: 0; transform: translate(0); }
    96% { opacity: 0.3; transform: translate(1px, 1px); }
    97% { opacity: 0.2; transform: translate(-1px, -0.5px); }
    98% { opacity: 0.1; transform: translate(0.5px, -1px); }
    99% { opacity: 0.05; transform: translate(-0.5px, 1px); }
}

nav .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
}

nav .nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
}

nav .nav-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
    padding: 5px 0;
}

nav .nav-links a::before {
    content: attr(data-text);
    position: absolute;
    top: 5px; left: 0;
    width: 100%; height: 100%;
    color: rgba(255,255,255,0.3);
    opacity: 0;
    transform: translate(0);
    transition: all 0.1s ease;
}

nav .nav-links a::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 2px;
    background: white;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
    box-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 2px white;
}

nav .nav-links a:hover {
    color: white;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        2px 0 0 rgba(255,255,255,0.2),
        -2px 0 0 rgba(255,255,255,0.2);
    animation: linkGlitch 0.5s ease-in-out;
}

nav .nav-links a:hover::before {
    opacity: 1;
    animation: linkGhostGlitch 0.6s infinite ease-in-out;
}

@keyframes linkGlitch {
    0% { transform: translate(0); }
    20% { transform: translate(-1px, 0.5px); }
    40% { transform: translate(1px, -0.5px); }
    60% { transform: translate(-0.5px, -0.5px); }
    80% { transform: translate(0.5px, 0.5px); }
    100% { transform: translate(0); }
}

@keyframes linkGhostGlitch {
    0%, 100% { transform: translate(0); opacity: 0.3; }
    25% { transform: translate(-1px, 0.5px); opacity: 0.5; }
    50% { transform: translate(1px, -0.5px); opacity: 0.2; }
    75% { transform: translate(-0.5px, 1px); opacity: 0.4; }
}

nav .logout-btn {
    background: rgba(255,255,255,0.08);
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
}

nav .logout-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
}

/* ===== Terminal Leaderboard ===== */
.terminal-wrap {
    position: relative;
    width: 100%;
    max-width: 900px;
    z-index: 2;
}

.terminal {
    background: rgba(8, 8, 8, 0.92);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
        0 0 80px rgba(255,255,255,0.03),
        inset 0 0 80px rgba(0,0,0,0.4);
}

/* Title bar */
.terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.terminal-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
}

.terminal-dot:nth-child(1) { background: rgba(255,80,80,0.6); }
.terminal-dot:nth-child(2) { background: rgba(255,200,50,0.5); }
.terminal-dot:nth-child(3) { background: rgba(80,200,80,0.5); }

.terminal-title {
    flex: 1;
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-right: 52px; /* offset for dots */
}

/* Scanlines inside terminal */
.terminal-body {
    position: relative;
    padding: 24px 28px 28px;
    min-height: 300px;
}

.terminal-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        rgba(0,0,0,0.06) 1px,
        rgba(0,0,0,0.06) 2px,
        transparent 3px
    );
    pointer-events: none;
    opacity: 0.5;
}

/* Prompt line */
.prompt {
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.08em;
    margin-bottom: 20px;
}

.prompt-path {
    color: rgba(255,255,255,0.7);
}

.cursor {
    display: inline-block;
    width: 10px;
    height: 1.2em;
    background: rgba(255,255,255,0.85);
    vertical-align: middle;
    animation: blink 1.3s step-end infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* Leaderboard table */
.lb-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    letter-spacing: 0.05em;
}

.lb-table thead th {
    padding: 10px 12px;
    text-align: left;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-size: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.lb-table thead th:last-child,
.lb-table tbody td:last-child {
    text-align: right;
}

.lb-table thead th:nth-child(3),
.lb-table tbody td:nth-child(3) {
    text-align: center;
}

.lb-table tbody tr {
    transition: background 0.15s;
}

.lb-table tbody tr:hover {
    background: rgba(255,255,255,0.03);
}

.lb-table tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.8);
}

/* Rank column */
.rank {
    font-weight: 700;
    min-width: 40px;
    color: rgba(255,255,255,0.5);
}

.rank-1 {
    color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,0.6);
}

.rank-2 {
    color: rgba(220,220,220,0.9);
    text-shadow: 0 0 6px rgba(255,255,255,0.3);
}

.rank-3 {
    color: rgba(200,200,200,0.8);
}

/* Score column */
.score-val {
    font-weight: 700;
    color: rgba(255,255,255,0.95);
}

/* Solved column */
.solved-val {
    color: rgba(180,255,180,0.85);
}

/* Footer inside terminal */
.terminal-footer {
    font-family: 'VT323', monospace;
    font-size: 1rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.12em;
    margin-top: 20px;
    text-align: center;
}

/* Loading */
.loading-msg {
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    color: rgba(255,255,255,0.4);
    text-align: center;
    padding: 40px 0;
    animation: loadBlink 1.5s ease-in-out infinite;
}

@keyframes loadBlink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
}

/* Empty state */
.empty-msg {
    font-family: 'VT323', monospace;
    font-size: 1.2rem;
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 40px 0;
}
</style>
</head>

<body>

<nav>
    <div class="nav-container">
        <a href="{% if session.get('user_id') %}{{ url_for('category') }}{% else %}{{ url_for('login') }}{% endif %}" class="logo">SECULETI</a>
        <div class="nav-links">
            <a href="{{ url_for('about') }}" data-text="О НАС">О НАС</a>
            {% if session.get('user_id') %}
                <a href="{{ url_for('category') }}" data-text="КАТЕГОРИИ">КАТЕГОРИИ</a>
                <a href="{{ url_for('leaderboard') }}" data-text="РЕЙТИНГ">РЕЙТИНГ</a>
                <a href="{{ url_for('suggest') }}" data-text="ПРЕДЛОЖЕНИЯ">ПРЕДЛОЖЕНИЯ</a>
                <a href="{{ url_for('writeups') }}" data-text="РАЙТАПЫ">РАЙТАПЫ</a>
                <a href="#" class="logout-btn" data-text="ВЫХОД" onclick="if(confirm('Выйти?')) window.location.href='{{ url_for('logout') }}'; return false;">ВЫХОД</a>
            {% else %}
                <a href="{{ url_for('leaderboard') }}" data-text="РЕЙТИНГ">РЕЙТИНГ</a>
                <a href="{{ url_for('login') }}" data-text="ВХОД">ВХОД</a>
                <a href="{{ url_for('register') }}" data-text="РЕГИСТРАЦИЯ">РЕГИСТРАЦИЯ</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="main-content">
<div class="terminal-wrap">
    <div class="terminal">

        <div class="terminal-bar">
            <span class="terminal-dot"></span>
            <span class="terminal-dot"></span>
            <span class="terminal-dot"></span>
            <span class="terminal-title">seculeti • scoreboard</span>
        </div>

        <div class="terminal-body">
            <div class="prompt">
                <span class="prompt-path">monitor@seculeti:~/scoreboard$</span> cat rankings.log <span class="cursor"></span>
            </div>

            <div id="leaderboard-content">
                <div class="loading-msg">Загрузка данных...</div>
            </div>

            <div class="terminal-footer" id="lb-footer"></div>
        </div>

    </div>
</div>
</div>

<script>
function padRight(str, len) {
    while (str.length < len) str += ' ';
    return str;
}

function loadLeaderboard() {
    fetch('/api/leaderboard')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('leaderboard-content');
            const footer = document.getElementById('lb-footer');

            if (!data.players || data.players.length === 0) {
                container.innerHTML = '<div class="empty-msg">— Пока никто не решил ни одного задания —</div>';
                return;
            }

            let html = '<table class="lb-table"><thead><tr>';
            html += '<th>#</th>';
            html += '<th>Player</th>';
            html += '<th>Solved</th>';
            html += '<th>Score</th>';
            html += '</tr></thead><tbody>';

            data.players.forEach((p, i) => {
                const rank = i + 1;
                let rankClass = 'rank';
                if (rank === 1) rankClass += ' rank-1';
                else if (rank === 2) rankClass += ' rank-2';
                else if (rank === 3) rankClass += ' rank-3';

                html += '<tr>';
                html += `<td class="${rankClass}">${rank}</td>`;
                html += `<td>${escapeHtml(p.username)}</td>`;
                html += `<td class="solved-val">${p.solved} / ${data.total_tasks}</td>`;
                html += `<td class="score-val">${p.score}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;

        })
        .catch(() => {
            document.getElementById('leaderboard-content').innerHTML =
                '<div class="empty-msg">Ошибка загрузки данных</div>';
        });
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function updateClock() {
    const now = new Date();
    // UTC + 3 = MSK
    const msk = new Date(now.getTime() + 3 * 60 * 60 * 1000);
    const dd = String(msk.getUTCDate()).padStart(2, '0');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const mm = months[msk.getUTCMonth()];
    const yyyy = msk.getUTCFullYear();
    const hh = String(msk.getUTCHours()).padStart(2, '0');
    const mi = String(msk.getUTCMinutes()).padStart(2, '0');
    const ss = String(msk.getUTCSeconds()).padStart(2, '0');
    document.getElementById('lb-footer').textContent =
        'auto-refresh 60s • ' + dd + ' ' + mm + ' ' + yyyy + ' ' + hh + ':' + mi + ':' + ss + ' MSK';
}

loadLeaderboard();
setInterval(loadLeaderboard, 60000);
updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
