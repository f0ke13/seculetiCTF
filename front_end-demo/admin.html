<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECULETI — Админ</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: #0a0a0a;
    color: white;
    display: flex;
    flex-direction: column;
    position: relative;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow: auto;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 25s linear infinite;
    pointer-events: none;
}

@keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: -40px -40px; }
}

body::after {
    content: "";
    position: fixed;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    filter: blur(100px);
    animation: pulse 7s ease-in-out infinite alternate;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

@keyframes pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.18); }
}

nav {
    position: relative;
    z-index: 1000;
    background: transparent;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 15px 0;
    overflow: hidden;
}

nav::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            rgba(255,255,255,0.03) 1px,
            rgba(255,255,255,0.03) 2px
        );
    pointer-events: none;
    animation: scanMove 4s linear infinite;
}

@keyframes scanMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 4px; }
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 40px;
    position: relative;
    z-index: 1;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: white;
    text-decoration: none;
    text-transform: uppercase;
}

.nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
    margin-left: auto;
}

.nav-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s ease;
}

.nav-links a:hover { color: white; }

.logout-btn {
    background: rgba(255,255,255,0.08);
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    text-decoration: none;
}

.container {
    position: relative;
    width: 90%;
    max-width: 980px;
    padding: 50px 40px;
    background: rgba(20,20,20,0.78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(255,255,255,0.04);
    z-index: 2;
}

h1, h2 {
    font-family: 'Courier New', Courier, monospace;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin: 20px 0 30px;
}

.stat-card {
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    background: rgba(15,15,15,0.9);
}

.stat-card h3 { font-size: 2rem; margin: 10px 0; }

.btn {
    padding: 12px 24px;
    background: white;
    color: black;
    border: none;
    font-weight: 600;
    cursor: pointer;
    border-radius: 7px;
    text-decoration: none;
    display: inline-block;
    margin-right: 12px;
    margin-bottom: 12px;
}
</style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="{{ url_for('admin_dashboard') }}" class="logo">SECULETI ADMIN</a>
        <div class="nav-links">
            <a href="{{ url_for('admin_dashboard') }}">ДАШБОРД</a>
            <a href="{{ url_for('admin_tasks') }}">ЗАДАЧИ</a>
            <a href="{{ url_for('admin_proposals') }}">ПРЕДЛОЖЕНИЯ</a>
            <a href="{{ url_for('category') }}" class="logout-btn">ВЫХОД</a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        <h1>Администратор</h1>
        <div class="grid">
            <div class="stat-card">Пользователи<h3>{{ user_count }}</h3></div>
            <div class="stat-card">Задачи<h3>{{ task_count }}</h3></div>
            <div class="stat-card">Ожидают<h3>{{ pending_proposals }}</h3></div>
        </div>
        <a href="{{ url_for('admin_tasks') }}" class="btn">Управление задачами</a>
        <a href="{{ url_for('admin_proposals') }}" class="btn">Предложения</a>
    </div>
</div>

</body>
</html>
