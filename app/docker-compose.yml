version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: etuctf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 11111111
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: etuctf_app
    depends_on:
      - db
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ../front_end-demo:/app/front_end-demo

volumes:
  postgres_data:
