version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: etuctf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 11111111
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    container_name: etuctf_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - .:/app

volumes:
  postgres_data: