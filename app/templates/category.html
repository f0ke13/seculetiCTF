<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ETUCTF Categories</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Space Grotesk', sans-serif;
    background: #0a0a0a;
    color: white;
    padding: 40px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.category {
    margin-bottom: 40px;
}

.task {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.1);
}

.task.solved {
    border: 1px solid #00ff88;
    box-shadow: 0 0 15px rgba(0,255,136,0.4);
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 30px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: white;
}

button {
    margin-top: 10px;
    padding: 12px 20px;
    background: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<h1>Categories</h1>

{% for category in categories %}
<div class="category">
    <h2>{{ category.name }}</h2>

    {% for task in tasks %}
        {% if task.category_id == category.id %}
            <div class="task {% if task.id in solved_tasks %}solved{% endif %}">
                <h3>{{ task.title }}</h3>
                <p>{{ task.description }}</p>
            </div>
        {% endif %}
    {% endfor %}
</div>
{% endfor %}

<form method="POST" action="{{ url_for('submit_flag') }}">
    <input type="text" name="flag" placeholder="Enter flag..." required>
    <button type="submit">Submit Flag</button>
</form>

</div>
</body>
</html>
